name: Architecture Graph

on:
  pull_request:
    paths:
      - ".github/workflows/architecture-graph.yml"
      - "backend/scripts/generate_architecture_graph.py"
      - "backend/scripts/generate_architecture_inventory.py"
      - "backend/tests/test_architecture_graph_generator.py"
      - "docs/architecture/**"
      - "docs/status/architecture-map-status.md"
      - "docs/testing/architecture-evidence-map.md"
      - "docs/testing/architecture-research-map.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/architecture-graph.yml"
      - "backend/scripts/generate_architecture_graph.py"
      - "backend/scripts/generate_architecture_inventory.py"
      - "backend/tests/test_architecture_graph_generator.py"
      - "docs/architecture/**"
      - "docs/status/architecture-map-status.md"
      - "docs/testing/architecture-evidence-map.md"
      - "docs/testing/architecture-research-map.md"
  workflow_dispatch:
    inputs:
      validation_mode:
        description: "Graph validation mode"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - heavy

jobs:
  fast:
    name: Fast graph gate
    if: github.event_name != 'workflow_dispatch' || inputs.validation_mode == 'fast'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Regenerate architecture inventory and graph artifacts
        run: |
          python backend/scripts/generate_architecture_inventory.py
          python backend/scripts/generate_architecture_graph.py

      - name: Check generated architecture artifacts are committed
        run: git diff --exit-code -- docs/architecture docs/status docs/testing

      - name: Run fast architecture graph pytest gate
        working-directory: backend
        run: python -m pytest -q tests/test_architecture_graph_generator.py -m "not slow"

      - name: Enforce curated architecture gap audit zero state
        run: python backend/scripts/query_architecture_graph.py --gaps --format json --fail-on-gaps > architecture-gaps-fast.json

      - name: Upload curated gap audit artifact (fast)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-gaps-fast
          path: architecture-gaps-fast.json
          if-no-files-found: error

      - name: Build hosted evidence packet (fast)
        run: python backend/scripts/build_architecture_graph_hosted_evidence_packet.py --fast-artifact architecture-gaps-fast.json --out-dir architecture-hosted-evidence-fast

      - name: Upload hosted evidence packet (fast)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-hosted-evidence-fast
          path: architecture-hosted-evidence-fast
          if-no-files-found: error

  heavy:
    name: Heavy graph gate
    if: github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'heavy'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Regenerate architecture inventory and graph artifacts
        run: |
          python backend/scripts/generate_architecture_inventory.py
          python backend/scripts/generate_architecture_graph.py

      - name: Check generated architecture artifacts are committed
        run: git diff --exit-code -- docs/architecture docs/status docs/testing

      - name: Run heavy architecture graph pytest gate
        working-directory: backend
        run: python -m pytest -q tests/test_architecture_graph_generator.py

      - name: Enforce curated architecture gap audit zero state
        run: python backend/scripts/query_architecture_graph.py --gaps --format json --fail-on-gaps > architecture-gaps-heavy.json

      - name: Upload curated gap audit artifact (heavy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-gaps-heavy
          path: architecture-gaps-heavy.json
          if-no-files-found: error

      - name: Build hosted evidence packet (heavy)
        run: python backend/scripts/build_architecture_graph_hosted_evidence_packet.py --fast-artifact architecture-gaps-heavy.json --out-dir architecture-hosted-evidence-heavy

      - name: Upload hosted evidence packet (heavy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-hosted-evidence-heavy
          path: architecture-hosted-evidence-heavy
          if-no-files-found: error
